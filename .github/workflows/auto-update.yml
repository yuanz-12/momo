name: 自动下载词典 → 运行脚本 → 提交结果
on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 UTC+8 6:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 下载目标仓库的最新词典文件
        run: |
          mkdir input_dicts
          # 仅克隆目标仓库的 wanxiang 分支
          git clone --depth 1 --branch wanxiang https://github.com/amzxyz/RIME-LMDG.git temp_repo
          # 将目标文件夹内的所有文件复制到 input_dicts 中
          cp -r temp_repo/dicts/* input_dicts/
          # 删除临时的克隆目录
          rm -rf temp_repo

      - name: 处理原始词库
        run: |
          python -m pip install --upgrade pip
          pip install tqdm
          mkdir -p output_dicts
          # 如果仓库里没有辅助码表文件夹，强制建一个空的防止 Python 脚本崩溃
          mkdir -p "辅助码表"
          python duofuzhu.py

      - name: 深入子目录批量重命名词库 (*.dict.yaml -> *.pro.dict.yaml)
        run: |
          # 使用 find 命令递归查找 output_dicts 目录下所有子文件夹中的 .dict.yaml 文件并重命名
          find output_dicts -type f -name "*.dict.yaml" | while read -r file; do
            new_name="${file%.dict.yaml}.pro.dict.yaml"
            mv "$file" "$new_name"
            echo "✅ 已重命名: $file -> $new_name"
          done

      - name: 提交输出文件到仓库
        env:
          GIT_AUTHOR_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci-bot
          GIT_COMMITTER_EMAIL: ci@example.com
        run: |
          # 核心决策点：将处理后的子文件夹结构完整复制到仓库根目录
          cp -rf output_dicts/* .
          git add .
          git commit -m "自动更新处理后词库 [ci skip]"
          git push
