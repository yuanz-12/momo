name: 自动下载词典 → 运行脚本 → 提交结果
on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 UTC+8 6:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 下载并筛选目标仓库的最新词典文件
        run: |
          mkdir input_dicts
          
          # 1. 克隆并复制第一个仓库的全部词典
          git clone --depth 1 --branch wanxiang https://github.com/amzxyz/RIME-LMDG.git temp_repo
          cp -r temp_repo/dicts/* input_dicts/
          rm -rf temp_repo
          
          # 2. 自动排除不需要的 mixed.dict.yaml 文件
          rm -f input_dicts/mixed.dict.yaml
          echo "已排除 mixed.dict.yaml"
          
          # 3. 新增爬取单个独立词典文件（已转换为 Raw 原始文件地址）
          curl -L "https://raw.githubusercontent.com/suiginko/moetype/main/tone_moe.dict.yaml" \
            -o "input_dicts/tone_moe.dict.yaml"
          echo "已成功追加下载 tone_moe.dict.yaml"

      - name: 处理原始词库
        run: |
          python -m pip install --upgrade pip
          pip install tqdm
          mkdir -p output_dicts
          # 如果仓库里没有辅助码表文件夹，强制建一个空的防止 Python 脚本崩溃
          mkdir -p "辅助码表"
          python duofuzhu.py

      - name: 深入子目录批量重命名词库 (*.dict.yaml -> *.pro.dict.yaml)
        run: |
          find output_dicts -type f -name "*.dict.yaml" | while read -r file; do
            new_name="${file%.dict.yaml}.pro.dict.yaml"
            mv "$file" "$new_name"
            echo "✅ 已重命名: $file -> $new_name"
          done
      - name: 提交输出文件到仓库
        env:
          GIT_AUTHOR_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci-bot
          GIT_COMMITTER_EMAIL: ci-bot@example.com
        run: |
          cp -rf output_dicts/* .
          git add .
          
          # 检查暂存区是否有文件变动 (--quiet 如果没有变动会返回 0)
          if git diff --staged --quiet; then
            echo "☕ 上游词库完全一致，没有检测到任何新更新，跳过本次提交。"
          else
            echo "🚀 检测到词库更新，开始提交变动..."
            git commit -m "自动更新处理后词库 [ci skip]"
            git push
          fi
