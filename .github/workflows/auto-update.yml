name: 自动下载词典 → 运行脚本 → 提交结果
on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 UTC+8 6:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 下载并筛选目标仓库的最新词典文件
        run: |
          # 1. 创建按功能分类的输入文件夹，以及免处理的“隔离区”文件夹
          mkdir -p input_dicts/dicts
          mkdir -p input_dicts/dicts_hant
          mkdir -p raw_bypass/dicts
          mkdir -p raw_bypass/dicts_hant
          
          # 2. 克隆仓库，并分别将 dicts 与 dicts_hant 内的文件复制到对应目录下
          git clone --depth 1 --branch wanxiang https://github.com/amzxyz/RIME-LMDG.git temp_repo
          cp -r temp_repo/dicts/* input_dicts/dicts/
          cp -r temp_repo/dicts_hant/* input_dicts/dicts_hant/
          rm -rf temp_repo
          
          # 3. 提取文件名前缀为 en 或 mixed 的文件，移动至隔离区，使其免于 Python 处理
          find input_dicts/dicts input_dicts/dicts_hant -type f \( -name "en*" -o -name "mixed*" \) | while read -r file; do
            # 提取相对路径（例如：dicts/mixed.dict.yaml）
            rel_path="${file#input_dicts/}"
            # 移动到对应的隔离区目录下
            mv "$file" "raw_bypass/$rel_path"
            echo "已隔离原始文件，跳过脚本处理: $rel_path"
          done
          
          # 4. 追加下载 moe.dict.yaml 到 input_dicts/dicts 目录下
          curl -L "https://raw.githubusercontent.com/suiginko/moetype/main/moe.dict.yaml" \
            -o "input_dicts/dicts/moe.dict.yaml"
          echo "已成功追加下载 moe.dict.yaml 到 dicts 目录"

      - name: 处理原始词库
        run: |
          python -m pip install --upgrade pip
          pip install tqdm
          mkdir -p output_dicts
          # 如果仓库里没有辅助码表文件夹，强制建一个空的防止 Python 脚本崩溃
          mkdir -p "辅助码表"
          python duofuzhu.py

      - name: 深入子目录批量重命名词库并合并原文件
        run: |
          # 第一步：先将经过 Python 处理的词库重命名为 *.pro.dict.yaml
          find output_dicts -type f -name "*.dict.yaml" | while read -r file; do
            new_name="${file%.dict.yaml}.pro.dict.yaml"
            mv "$file" "$new_name"
            echo "✅ 已重命名: $file -> $new_name"
          done
          
          # 第二步：把隔离区里免处理的原始文本合并到输出目录中
          cp -r raw_bypass/* output_dicts/
          echo "✅ 已将免处理的原始文件无缝合并至输出目录，准备提交"

      - name: 提交输出文件到仓库
        env:
          GIT_AUTHOR_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci-bot
          GIT_COMMITTER_EMAIL: ci-bot@example.com
        run: |
          cp -rf output_dicts/* .
          git add .
          
          # 检查暂存区是否有文件变动 (--quiet 如果没有变动会返回 0)
          if git diff --staged --quiet; then
            echo "☕ 上游词库完全一致，没有检测到任何新更新，跳过本次提交。"
          else
            echo "🚀 检测到词库更新，开始提交变动..."
            git commit -m "自动更新处理后词库 [ci skip]"
            git push
          fi
