name: 自动下载词典 → 运行脚本 → 提交结果
on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 UTC+8 6:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 下载目标仓库的最新词典文件
        run: |
          mkdir input_dicts
          # 仅克隆目标仓库的 wanxiang 分支
          git clone --depth 1 --branch wanxiang https://github.com/amzxyz/RIME-LMDG.git temp_repo
          # 将目标文件夹内的所有文件复制到 input_dicts 中
          cp -r temp_repo/dicts/* input_dicts/
          # 删除临时的克隆目录
          rm -rf temp_repo

      - name: 处理原始词库
        run: |
          python -m pip install --upgrade pip
          pip install tqdm
          mkdir -p output_dicts
          python duofuzhu.py

      - name: 批量重命名输出词库 (*.dict.yaml -> *.pro.dict.yaml)
        run: |
          cd output_dicts
          # 遍历所有符合 *.dict.yaml 格式的文件
          for file in *.dict.yaml; do
            # 确保文件确实存在，避免空匹配
            if [ -f "$file" ]; then
              # 去掉末尾的 .dict.yaml 并拼接上 .pro.dict.yaml
              new_name="${file%.dict.yaml}.pro.dict.yaml"
              mv "$file" "$new_name"
              echo "已重命名: $file -> $new_name"
            fi
          done

      - name: 提交输出文件到仓库
        env:
          GIT_AUTHOR_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci-bot
          GIT_COMMITTER_EMAIL: ci@example.com
        run: |
          cp -rf output_dicts/* .
          git add .
          git commit -m "自动更新处理后词库 [ci skip]"
          git push
